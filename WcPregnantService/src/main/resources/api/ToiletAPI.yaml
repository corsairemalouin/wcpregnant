openapi: 3.0.0
info:
  title: Toilet API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api

paths:
  /toilet:
    get:
      tags:
        - Toilet
      summary: Récupérer les toilettes à proximité
      operationId: getNearsetToilettes
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
      responses:
        '200':
          description: Liste des toilettes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'ObjectDefinitions.yaml#/components/schemas/Toilet'

  /toilet/{id}:
    get:
      tags:
        - Toilet
      summary: Lire une toilette par son ID
      operationId: lireToilette
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Détails de la toilette
          content:
            application/json:
              schema:
                $ref: 'ObjectDefinitions.yaml#/components/schemas/Toilet'