openapi: 3.0.0
info:
  title: Object Definitions
  version: 1.0.0

components:
  schemas:
    Adress:
      type: object
      properties:
        numero:
          type: string
        voie:
          type: string
        codePostal:
          type: string
        ville:
          type: string
        pays:
          type: string

    Graduation:
      type: object
      properties:
        proprete:
          type: integer
        accueil:
          type: integer
        espace:
          type: integer

    GeoPosition:
      type: object
      properties:
        latitude:
          type: double
        longitude:
          type: double

    Customer:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
        nom:
          type: string
        prenom:
          type: string
        adress:
          $ref: '#/components/schemas/Adress'

    Toilet:
      type: object
      properties:
        libelle:
          type: string
        distance:
          type: double
        adress:
          $ref: '#/components/schemas/Adress'
        grade:
          $ref: '#/components/schemas/Graduation'
        position:
          $ref: '#/components/schemas/GeoPosition'