openapi: 3.0.0
info:
  title: Object Definitions
  version: 1.0.0

components:
  schemas:
    # Note: J'ai gardé "Adress" pour correspondre à votre import actuel,
    # mais le standard anglais est "Address".
    Adress:
      type: object
      properties:
        numero:
          type: string
        voie:
          type: string
        codePostal:
          type: string
        ville:
          type: string
        pays:
          type: string

    Graduation:
      type: object
      properties:
        proprete:
          type: integer
          format: int32
        accueil:
          type: integer
          format: int32
        espace:
          type: integer
          format: int32

    GeoPosition:
      type: object
      properties:
        latitude:
          type: number   # Correction: En OpenAPI, on utilise 'number'
          format: double # et le format 'double'
        longitude:
          type: number   # Correction: Idem ici
          format: double

    Customer:
      type: object
      required:
        - login # Bonne pratique: définir ce qui est obligatoire
      properties:
        login:
          type: string
        password:
          type: string
        nom:
          type: string
        prenom:
          type: string
        adress:
          $ref: '#/components/schemas/Adress'

    Toilet:
      type: object
      properties:
        id: # AJOUT CRUCIAL : sans cela, l'ID n'existe pas dans ton DTO Java
          type: integer
          format: int64
        libelle:
          type: string
        distance:
          type: number
          format: double
        adress:
          $ref: '#/components/schemas/Adress'
        grade:
          $ref: '#/components/schemas/Graduation'
        position:
          $ref: '#/components/schemas/GeoPosition'