openapi: 3.0.0
info:
  title: Customer API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api

paths:
  /customers:
    get:
      tags:
        - Customer
      summary: Récupérer tous les clients
      operationId: getAllCustomers
      responses:
        '200':
          description: Liste des clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'ObjectDefinitions.yaml#/components/schemas/Customer'

  /customers/{login}:
    get:
      tags:
        - Customer
      summary: Lire un client par son login
      operationId: getCustomerByLogin
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails du client
          content:
            application/json:
              schema:
                $ref: 'ObjectDefinitions.yaml#/components/schemas/Customer'