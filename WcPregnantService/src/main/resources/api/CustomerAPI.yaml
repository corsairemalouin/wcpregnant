openapi: 3.0.0
info:
  title: Customer API
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/wcpregnant # Harmonisé avec votre projet précédent

paths:
  /customers:
    get:
      tags:
        - Customer
      summary: Liste tous les clients
      operationId: getCustomers
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './ObjectDefinitions.yaml#/components/schemas/Customer' # Ajout du ./

    post:
      tags:
        - Customer
      summary: Créer un client
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './ObjectDefinitions.yaml#/components/schemas/Customer'
      responses:
        '201':
          description: Client créé

  /customers/{login}:
    get:
      tags:
        - Customer
      summary: Détails par login
      operationId: getCustomerByLogin
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './ObjectDefinitions.yaml#/components/schemas/Customer'