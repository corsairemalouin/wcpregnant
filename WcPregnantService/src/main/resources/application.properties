# --- Port HTTP de l'application ---
# Port dédié au projet : 14007, choisi hors des ports usuels (8080, 8081, 4200, 5432)
# et hors de la plage éphémère Windows (49152-65535) pour éviter toute interférence
# avec un autre service local. Surchargeable par la variable d'environnement API_PORT
# ou par l'argument --server.port.
server.port=${API_PORT:14007}

app.distance.max=50
# Nombre maximal de résultats renvoyés par la recherche de proximité (démonstration locale)
app.result.max=10

# --- Couche agentique (Tool Calling) ---
# Rayon par défaut et rayon maximal d'une recherche de proximité (en mètres)
agent.tools.default-radius=200.0
agent.tools.max-radius=5000.0
agent.tools.max-results=10
# Inférence 100 % locale : Strata AI expose une API compatible OpenAI sur le réseau privé.
# Surchargeable par les variables d'environnement AGENT_INFERENCE_BASE_URL, AGENT_MODEL,
# AGENT_TIMEOUT_SECONDS et AGENT_MAX_ITERATIONS.
agent.inference.base-url=${AGENT_INFERENCE_BASE_URL:http://localhost:8000/v1}
agent.inference.model=${AGENT_MODEL:Qwen-3.8-Flash-Next}
agent.inference.timeout-seconds=${AGENT_TIMEOUT_SECONDS:30}
# Nombre maximal d'allers-retours modèle <-> outils avant de rendre une réponse
agent.max-iterations=${AGENT_MAX_ITERATIONS:4}

# Sonde de santé Actuator : les probes Kubernetes (liveness/readiness) et le
# HEALTHCHECK Docker interrogent /actuator/health et /actuator/health/readiness.
management.endpoint.health.probes.enabled=true

# Base H2 en mémoire pour le lancement local (surchargeable par SPRING_DATASOURCE_URL)
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
logging.level.org.manu.wcpregnant=debug

# --- RÉINITIALISATION DU MOT DE PASSE ---
# Validité du code envoyé à l'utilisateur, en secondes.
auth.reset.code-ttl-seconds=${AUTH_RESET_CODE_TTL_SECONDS:900}
# false = mode démonstration : le code est renvoyé dans la réponse faute de SMTP.
auth.mail.enabled=${MAIL_ENABLED:false}
auth.mail.from=${MAIL_FROM:wcpregnant@example.com}
# Paramètres SMTP mobilisés uniquement lorsque auth.mail.enabled=true.
auth.mail.host=${MAIL_HOST:localhost}
auth.mail.port=${MAIL_PORT:25}
auth.mail.username=${MAIL_USERNAME:}
auth.mail.password=${MAIL_PASSWORD:}

# --- COMPTES DE DÉMONSTRATION (matrice RBAC) ---
# Source de vérité des profils : org.manu.wcpregnant.bdd.seed.TestUserProfiles.
# Seuls les identifiants des deux comptes principaux sont configurables ; les
# profils de test (adminonly, norole, disabled) sont déclarés dans le code.
# Ces valeurs de démonstration doivent être remplacées dans un environnement réel.
demo.user.username=${DEMO_USER_USERNAME:manu}
demo.user.password=${DEMO_USER_PASSWORD:manu}
demo.admin.username=${DEMO_ADMIN_USERNAME:admin}
demo.admin.password=${DEMO_ADMIN_PASSWORD:admin}
# false = uniquement manu et admin ; true = matrice RBAC complète
# (ADMIN seul, authentifié sans rôle, compte désactivé) pour les tests de sécurité.
demo.test-accounts.enabled=${DEMO_TEST_ACCOUNTS_ENABLED:true}
