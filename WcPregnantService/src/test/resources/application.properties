# Ce fichier MASQUE src/main/resources/application.properties dans le contexte de test
# (un seul application.properties est chargé depuis le classpath). Il doit donc
# redéclarer le port dédié du projet pour que les tests vérifient la même politique
# de configuration que l'application réelle.
server.port=${API_PORT:14007}
logging.level.root=warn
logging.level.org.manu.service.wcpregnant=debug
app.distance.max=350000
app.result.max=2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.cloud.stream.bindings.enrichLogMessage-in-0.destination=queue.log.messages
spring.cloud.stream.bindings.enrichLogMessage-out-0.destination=queue.pretty.log.messages

