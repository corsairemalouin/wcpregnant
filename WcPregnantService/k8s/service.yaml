apiVersion: v1
kind: Service
metadata:
  name: wcpregnant-service
  namespace: wcpregnant
spec:
  selector:
    app: wcpregnant
  ports:
    - protocol: TCP
      port: 80
      # Le Service expose l'application sur 80 ; le conteneur écoute sur le port
      # dédié 14007 (voir server.port dans application.properties).
      targetPort: 14007
  type: ClusterIP

