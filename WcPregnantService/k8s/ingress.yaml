apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wcpregnant-ingress
  namespace: wcpregnant
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - wcpregnant.example.com
      secretName: wcpregnant-tls
  rules:
    - host: wcpregnant.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wcpregnant-service
                port:
                  number: 80

