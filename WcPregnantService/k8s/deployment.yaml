apiVersion: apps/v1
kind: Deployment
metadata:
  name: wcpregnant-deployment
  namespace: wcpregnant
  labels:
    app: wcpregnant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wcpregnant
  template:
    metadata:
      labels:
        app: wcpregnant
    spec:
      containers:
        - name: wcpregnant
          # Image locale pour la vérification sur kind/Docker Desktop.
          # En production : ghcr.io/<OWNER>/wcpregnant:latest (voir CI docker-image.yml).
          image: wcpregnant:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: wcpregnant-db-secret
                  key: db-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wcpregnant-db-secret
                  key: db-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wcpregnant-db-secret
                  key: db-password
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
            # Inférence agentique (Strata AI local) : valeurs injectées
            # depuis le ConfigMap, jamais en dur dans le Deployment.
            - name: AGENT_INFERENCE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: wcpregnant-config
                  key: AGENT_INFERENCE_BASE_URL
            - name: AGENT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: wcpregnant-config
                  key: AGENT_MODEL
            - name: AGENT_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: wcpregnant-config
                  key: AGENT_TIMEOUT_SECONDS
            - name: AGENT_MAX_ITERATIONS
              valueFrom:
                configMapKeyRef:
                  name: wcpregnant-config
                  key: AGENT_MAX_ITERATIONS
          volumeMounts:
            - name: app-config
              mountPath: /etc/app
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: app-config
          configMap:
            name: wcpregnant-config

