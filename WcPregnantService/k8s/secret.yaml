apiVersion: v1
kind: Secret
metadata:
  name: wcpregnant-db-secret
  namespace: wcpregnant
type: Opaque
stringData:
  db-user: wcpregnant
  db-password: changeme
  db-url: jdbc:postgresql://postgres:5432/wcpregnant
  # Mots de passe des comptes de démonstration : valeurs de démonstration à
  # remplacer avant tout déploiement réel (jamais un mot de passe vrai ici).
  demo-user-password: changeme
  demo-admin-password: changeme

