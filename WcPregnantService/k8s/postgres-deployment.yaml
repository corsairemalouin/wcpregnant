apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: wcpregnant
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # PostgreSQL 18 (Alpine). Le PVC `postgres-pvc` formaté par une version
          # antérieure (15) doit être recreé ou migré via pg_dump/pg_restore :
          # le répertoire de données n'est pas compatible entre versions majeures.
          image: postgres:18-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wcpregnant-db-secret
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wcpregnant-db-secret
                  key: db-password
            - name: POSTGRES_DB
              value: wcpregnant
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              # PostgreSQL 18+ : montage racine /var/lib/postgresql (les données
              # sont écrites dans /var/lib/postgresql/18/docker).
              mountPath: /var/lib/postgresql
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U wcpregnant
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U wcpregnant
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
# Service indispensable : le Secret pointe SPRING_DATASOURCE_URL sur
# jdbc:postgresql://postgres:5432/wcpregnant. Sans ce Service, le nom DNS
# « postgres » ne se résout pas et l'application ne peut pas se connecter.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: wcpregnant
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

