apiVersion: v1
kind: ConfigMap
metadata:
  name: wcpregnant-config
  namespace: wcpregnant
  labels:
    app: wcpregnant
data:
  application.properties: |
    spring.application.name=wcpregnant
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=false
    logging.level.root=INFO
    logging.level.org.manu.wcpregnant=DEBUG
    app.distance.max=100.0
    app.result.max=5
    server.servlet.context-path=/api
  # Paramètres de la couche agentique (Tool Calling) injectés au Deployment
  # via envFrom/configMapKeyRef. L'inférence reste 100 % locale : l'URL pointe
  # vers le serveur Strata AI du réseau privé (à adapter à votre installation).
  AGENT_INFERENCE_BASE_URL: http://strata-ai:8000/v1
  AGENT_MODEL: Qwen-3.8-Flash-Next
  AGENT_TIMEOUT_SECONDS: "30"
  AGENT_MAX_ITERATIONS: "4"
  # Comptes de démonstration (matrice RBAC) : dans un cluster, les profils de test
  # supplémentaires (ADMIN seul, authentifié sans rôle, compte désactivé) sont
  # désactivés. Les identifiants ne sont pas sensibles ; les mots de passe proviennent
  # du Secret wcpregnant-db-secret.
  DEMO_TEST_ACCOUNTS_ENABLED: "false"
  DEMO_USER_USERNAME: demo-user
  DEMO_ADMIN_USERNAME: demo-admin

