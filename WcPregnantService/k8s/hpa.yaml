apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wcpregnant-hpa
  namespace: wcpregnant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wcpregnant-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

