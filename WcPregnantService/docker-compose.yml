services:
  db:
    image: postgres:15-alpine
    # Résilience : relance automatique du conteneur en cas de crash ou d'arrêt
    # inattendu. "unless-stopped" respecte un arrêt volontaire (compose stop).
    restart: unless-stopped
    environment:
      POSTGRES_USER: wcpregnant
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: wcpregnant
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    image: wcpregnant:local
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wcpregnant
      SPRING_DATASOURCE_USERNAME: wcpregnant
      SPRING_DATASOURCE_PASSWORD: changeme
      JAVA_OPTS: "-Xms256m -Xmx512m"
      # Profil Spring : prod par défaut (comptes stockés dans PostgreSQL), comportement
      # inchangé. Surchargeable via SPRING_PROFILES_ACTIVE=dev pour bénéficier des
      # comptes de démonstration (admin/admin, manu/manu) lors d'un déploiement local.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Couche agentique (Tool Calling) : inférence locale Strata AI.
      # Surchargeable via un fichier .env ou le shell (jamais de clé en dur).
      AGENT_INFERENCE_BASE_URL: ${AGENT_INFERENCE_BASE_URL:-http://host.docker.internal:8000/v1}
      AGENT_MODEL: ${AGENT_MODEL:-Qwen-3.8-Flash-Next}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-30}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-4}
      # Comptes de démonstration (matrice RBAC) : seuls les deux comptes principaux
      # sont configurables, les profils de test sont déclarés dans TestUserProfiles.
      # Valeurs de démonstration à remplacer en environnement réel.
      DEMO_USER_USERNAME: ${DEMO_USER_USERNAME:-manu}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-manu}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin}
      DEMO_TEST_ACCOUNTS_ENABLED: ${DEMO_TEST_ACCOUNTS_ENABLED:-true}
    # Port dédié au projet : 14007 (hors ports usuels et hors plage éphémère Windows).
    # Surchargeable par API_PORT ; le port interne doit rester celui du serveur Spring.
    ports:
      - "${API_PORT:-14007}:14007"


volumes:
  db_data:

